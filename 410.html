<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>410 Gone | SoloThinking</title>

<style>
:root{
    --bg:#0e1628;
    --bg2:#1a2540;
    --accent:#63D5FE;
    --purple:#6C63FF;
    --text:#ffffff;
    --muted:rgba(255,255,255,.7);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    font-family:Inter,sans-serif;
    background:linear-gradient(135deg,var(--bg),var(--bg2));
    overflow:hidden;
}

.container{
    max-width:700px;
    padding:40px;
    position:relative;
    z-index:2;
}

.code{
    font-size:120px;
    font-weight:800;
    background:linear-gradient(90deg,var(--accent),var(--purple));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    line-height:1;
}

h1{
    color:white;
    font-size:42px;
    margin:20px 0;
}

p{
    color:var(--muted);
    font-size:18px;
    line-height:1.7;
    margin-bottom:35px;
}

.btns{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    padding:14px 28px;
    border-radius:50px;
    text-decoration:none;
    transition:.3s;
    font-weight:600;
}

.btn-primary{
    background:var(--accent);
    color:#000;
}

.btn-secondary{
    border:1px solid rgba(255,255,255,.25);
    color:white;
}

.btn:hover{
    transform:translateY(-3px);
}

.circle{
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
    opacity:.25;
}

.c1{
    width:300px;
    height:300px;
    background:#63D5FE;
    top:-100px;
    left:-100px;
}

.c2{
    width:300px;
    height:300px;
    background:#6C63FF;
    bottom:-100px;
    right:-100px;
}

.icon{
    font-size:70px;
    margin-bottom:15px;
    animation:float 4s ease-in-out infinite;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-12px);
    }
}

@media(max-width:768px){

    .code{
        font-size:80px;
    }

    h1{
        font-size:30px;
    }

    p{
        font-size:16px;
    }

}
</style>
</head>

<body>

<div class="circle c1"></div>
<div class="circle c2"></div>

<div class="container">

    <div class="icon">⌛</div>

    <div class="code">410</div>

    <h1>Content Permanently Removed</h1>

    <p>
        This page has been permanently removed from SoloThinking
        and is no longer available.
    </p>

    <div class="btns">
        <a href="/" class="btn btn-primary">Go Home</a>
        <a href="/tools/" class="btn btn-secondary">Explore Tools</a>
    </div>

</div>

</body>
</html>
